<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR 18+</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.45s ease;
            position: relative;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.1rem, 7vw, 4.2rem);
            font-weight: 900;
            background: linear-gradient(90deg, #ff00cc, #00ffff, #ff00cc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        @keyframes shine { to { background-position: 200% center; } }
 
        .app-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.7rem, 5.5vw, 2.8rem);
            color: #ff2d55;
            margin: 18px 0 35px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff2d55;
        }

        .btn {
            background: linear-gradient(135deg, #ff2d55, #ff00cc);
            border: none;
            color: white;
            padding: 15px 42px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 22px rgba(255,45,85,0.45);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(255,45,85,0.75); }
        .btn:active { transform: scale(0.97); }

        .btn-secondary {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 12px rgba(0,255,255,0.25);
        }
        .btn-secondary:hover {
            background: rgba(0,255,255,0.12);
            box-shadow: 0 0 25px rgba(0,255,255,0.5);
        }

        .age-box {
            background: rgba(18,18,28,0.95);
            border: 1px solid #ff2d55;
            border-radius: 22px;
            padding: 38px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 35px rgba(255,45,85,0.22);
        }
        .age-box h2 { font-size: 1.7rem; margin-bottom: 12px; color: #ff2d55; }
        .age-box p { color: #aaa; margin-bottom: 28px; line-height: 1.5; }
        .age-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

        .step-title {
            font-size: 1.55rem;
            margin-bottom: 28px;
            color: #00ffff;
            font-weight: 700;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            max-width: 680px;
            width: 100%;
            margin-bottom: 28px;
        }
        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.14);
            color: white;
            padding: 17px 10px;
            border-radius: 15px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.22s ease;
        }
        .option-btn:hover {
            border-color: #ff2d55;
            background: rgba(255,45,85,0.14);
            transform: translateY(-2px);
        }
        .option-btn.selected {
            border-color: #ff2d55;
            background: linear-gradient(135deg, rgba(255,45,85,0.28), rgba(255,0,204,0.28));
            box-shadow: 0 0 18px rgba(255,45,85,0.35);
        }

        .result-container { max-width: 900px; width: 100%; }
        .image-wrapper {
            position: relative;
            background: #111;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #ff2d55;
            box-shadow: 0 0 35px rgba(255,45,85,0.28);
            margin-bottom: 22px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 78vh;
            display: block;
            border-radius: 16px;
        }
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 10;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,45,85,0.3);
            border-top-color: #ff2d55;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .prompt-text {
            font-size: 0.82rem;
            color: #777;
            margin-top: 10px;
            word-break: break-all;
        }
        .controls {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 18px;
        }
        .selected-info {
            background: rgba(0,255,255,0.07);
            border: 1px solid rgba(0,255,255,0.28);
            border-radius: 12px;
            padding: 11px 18px;
            margin-bottom: 18px;
            font-size: 0.93rem;
            color: #00ffff;
        }

        .back-btn {
            position: absolute;
            top: 18px; left: 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 7px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.88rem;
            z-index: 20;
        }
        .back-btn:hover { background: rgba(255,255,255,0.18); }

        .settings-btn {
            position: absolute;
            top: 18px; right: 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 42px; height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: 0.2s;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.2); transform: rotate(30deg); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #14141f;
            border: 1px solid #ff2d55;
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(255,45,85,0.3);
            text-align: left;
        }
        .modal h3 {
            font-size: 1.4rem;
            color: #ff2d55;
            margin-bottom: 18px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 6px;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: #ff2d55;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }
        .api-status {
            font-size: 0.82rem;
            margin-top: 10px;
            text-align: center;
            color: #00ff9d;
        }
        .api-status.error { color: #ff4d6d; }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
            .btn { padding: 13px 28px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- INTRO -->
    <div id="intro" class="screen active">
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="intro-title">MADE BY ĚVĪL,Š</div>
        <div class="app-name">FOR 18+</div>
        <button class="btn" onclick="goToAge()">START</button>
    </div>

    <!-- AGE GATE -->
    <div id="ageGate" class="screen">
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="age-box">
            <h2>Age Verification</h2>
            <p>This app contains adult content.<br>You must be 18 years or older to continue.</p>
            <div class="age-buttons">
                <button class="btn" onclick="confirmAge(true)">I am 18+</button>
                <button class="btn btn-secondary" onclick="confirmAge(false)">Under 18</button>
            </div>
        </div>
    </div>

    <!-- ANATOMY CATEGORY -->
    <div id="anatomyType" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="step-title">Select Human Anatomy System</div>
        <div class="options-grid" id="anatomyOptions"></div>
    </div>

    <!-- ETHNICITY / REGION -->
    <div id="ethnicity" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="step-title">Select Style / Region</div>
        <div class="options-grid" id="ethOptions"></div>
    </div>

    <!-- AGE -->
    <div id="ageSelect" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="step-title">Select Age</div>
        <div class="options-grid" id="ageOptions"></div>
    </div>

    <!-- RATIO -->
    <div id="ratioSelect" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="step-title">Select Aspect Ratio</div>
        <div class="options-grid" id="ratioOptions"></div>
    </div>

    <!-- STYLE -->
    <div id="styleSelect" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="step-title">Select Image Style</div>
        <div class="options-grid" id="styleOptions"></div>
    </div>

    <!-- RESULT -->
    <div id="result" class="screen">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <div class="result-container">
            <div class="selected-info" id="selectedInfo"></div>
            <div class="image-wrapper">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Generating high quality image...</div>
                </div>
                <img id="resultImage" style="display:none;" alt="Generated Image">
            </div>
            <div class="prompt-text" id="promptPreview"></div>
            <div class="controls">
                <button class="btn" onclick="generateImage()">GENERATE AGAIN</button>
                <button class="btn btn-secondary" onclick="restart()">NEW SELECTION</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ API Settings</h3>

            <div class="form-group">
                <label>Generation Mode</label>
                <select id="apiMode">
                    <option value="free">Free (Pollinations - No Key)</option>
                    <option value="stability">Stability AI (API Key Required)</option>
                </select>
            </div>

            <div class="form-group" id="keyGroup">
                <label>API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Paste your Stability AI key here">
            </div>

            <div class="api-status" id="apiStatus"></div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                <button class="btn" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ========== STATE ==========
        const selections = { anatomy: null, ethnicity: null, age: null, ratio: null, style: null };
        const history = [];
        let apiMode = localStorage.getItem('apiMode') || 'free';
        let apiKey = localStorage.getItem('apiKey') || '';

        // ========== NEW ANATOMY OPTIONS ==========
        const anatomyTypes = [
            { id: 'heart', label: 'Human Heart Anatomy', prompt: 'detailed medical illustration of human heart anatomy, cardiac muscular structure, ventricles and blood vessels, scientific 3d render' },
            { id: 'full_body', label: 'Full Body Anatomy', prompt: 'full body human anatomy structure, realistic medical medical anatomical model, detailed organs and bone structure' },
            { id: 'skeleton', label: 'Human Skeleton', prompt: 'detailed human skeleton anatomy, full skeletal system, realistic bone structure, medical scientific illustration' },
            { id: 'brain', label: 'Human Brain Anatomy', prompt: 'detailed human brain anatomy, cerebral cortex, neurons, central nervous system, high resolution scientific rendering' },
            { id: 'muscular', label: 'Muscular System', prompt: 'full human muscular system anatomy, detailed muscle fiber structure, athletic muscular anatomy model' },
            { id: 'digestive', label: 'Digestive System', prompt: 'human digestive system anatomy, stomach, intestines and digestive organs, detailed medical diagram' },
            { id: 'circulatory', label: 'Circulatory System', prompt: 'human circulatory system anatomy, detailed blood vessels, arteries, veins and heart network' },
            { id: 'respiratory', label: 'Respiratory System', prompt: 'human respiratory system anatomy, lungs, trachea and airway passage, detailed medical illustration' }
        ];

        const ethnicities = [
            { id: 'asian', label: 'Asian', prompt: 'East Asian physiological characteristics' },
            { id: 'european', label: 'European', prompt: 'Caucasian physiological characteristics' },
            { id: 'western', label: 'Western', prompt: 'Western global physical traits' }
        ];
        const ages = [18, 25, 30, 35, 40, 50, 60, 70];
        const ratios = [
            { id: '19:6', label: '19:6', w: 1216, h: 384, stability: '21:9' },
            { id: '16:9', label: '16:9', w: 1280, h: 720, stability: '16:9' },
            { id: '1:1', label: '1:1', w: 1024, h: 1024, stability: '1:1' },
            { id: '3:4', label: '3:4', w: 768, h: 1024, stability: '3:4' }
        ];
        const styles = [
            { id: 'anime', label: 'Anime Style', prompt: 'anime style illustration, vibrant colors, detailed schematic lineart' },
            { id: 'realistic', label: 'Hyper Realistic', prompt: 'hyper realistic 8k, detailed realistic texture, cinematic lighting, studio quality' }
        ];

        // ========== INIT ==========
        document.getElementById('apiMode').value = apiMode;
        document.getElementById('apiKeyInput').value = apiKey;
        toggleKeyField();

        document.getElementById('apiMode').addEventListener('change', toggleKeyField);

        function toggleKeyField() {
            const mode = document.getElementById('apiMode').value;
            document.getElementById('keyGroup').style.display = mode === 'stability' ? 'block' : 'none';
        }

        // ========== SETTINGS ==========
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiStatus').textContent = '';
        }
        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }
        function saveSettings() {
            apiMode = document.getElementById('apiMode').value;
            apiKey = document.getElementById('apiKeyInput').value.trim();

            localStorage.setItem('apiMode', apiMode);
            localStorage.setItem('apiKey', apiKey);

            const status = document.getElementById('apiStatus');
            if (apiMode === 'stability' && !apiKey) {
                status.textContent = '⚠️ Stability mode selected but no API key entered';
                status.className = 'api-status error';
                return;
            }
            status.textContent = '✅ Settings saved successfully';
            status.className = 'api-status';
            setTimeout(closeSettings, 800);
        }

        // ========== NAVIGATION ==========
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function goToAge() {
            history.push('intro');
            showScreen('ageGate');
        }
        function confirmAge(isAdult) {
            if (!isAdult) {
                alert('Sorry, you must be 18 or older to use this app.');
                return;
            }
            history.push('ageGate');
            renderAnatomyOptions();
            showScreen('anatomyType');
        }
        function goBack() {
            if (history.length === 0) return;
            showScreen(history.pop());
        }
        function restart() {
            Object.keys(selections).forEach(k => selections[k] = null);
            history.length = 0;
            showScreen('intro');
        }

        // ========== RENDER OPTIONS ==========
        function renderAnatomyOptions() {
            const c = document.getElementById('anatomyOptions');
            c.innerHTML = '';
            anatomyTypes.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = item.label;
                btn.onclick = () => {
                    selections.anatomy = item;
                    history.push('anatomyType');
                    renderEthnicityOptions();
                    showScreen('ethnicity');
                };
                c.appendChild(btn);
            });
        }
        function renderEthnicityOptions() {
            const c = document.getElementById('ethOptions');
            c.innerHTML = '';
            ethnicities.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = item.label;
                btn.onclick = () => {
                    selections.ethnicity = item;
                    history.push('ethnicity');
                    renderAgeOptions();
                    showScreen('ageSelect');
                };
                c.appendChild(btn);
            });
        }
        function renderAgeOptions() {
            const c = document.getElementById('ageOptions');
            c.innerHTML = '';
            ages.forEach(age => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = age + ' years model';
                btn.onclick = () => {
                    selections.age = age;
                    history.push('ageSelect');
                    renderRatioOptions();
                    showScreen('ratioSelect');
                };
                c.appendChild(btn);
            });
        }
        function renderRatioOptions() {
            const c = document.getElementById('ratioOptions');
            c.innerHTML = '';
            ratios.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = item.label;
                btn.onclick = () => {
                    selections.ratio = item;
                    history.push('ratioSelect');
                    renderStyleOptions();
                    showScreen('styleSelect');
                };
                c.appendChild(btn);
            });
        }
        function renderStyleOptions() {
            const c = document.getElementById('styleOptions');
            c.innerHTML = '';
            styles.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = item.label;
                btn.onclick = () => {
                    selections.style = item;
                    history.push('styleSelect');
                    showScreen('result');
                    generateImage();
                };
                c.appendChild(btn);
            });
        }

        // ========== GENERATE IMAGE ==========
        async function generateImage() {
            const loading = document.getElementById('loading');
            const img = document.getElementById('resultImage');
            const info = document.getElementById('selectedInfo');
            const promptPreview = document.getElementById('promptPreview');

            loading.style.display = 'flex';
            loading.innerHTML = `<div class="spinner"></div><div>Generating high quality image...</div>`;
            img.style.display = 'none';

            const promptParts = [
                selections.style.prompt,
                selections.anatomy.prompt,
                selections.ethnicity.prompt,
                selections.age + ' years old body proportions',
                'masterpiece, high contrast, fine details, accurate anatomical structure'
            ];
            const fullPrompt = promptParts.join(', ');

            info.innerHTML = `
                <strong>${selections.anatomy.label}</strong> • 
                ${selections.ethnicity.label} • 
                ${selections.age} yrs • 
                ${selections.ratio.label} • 
                ${selections.style.label}
                <br><small style="color:#888">Mode: ${apiMode === 'free' ? 'Free (Pollinations)' : 'Stability AI'}</small>
            `;
            promptPreview.textContent = 'Prompt: ' + fullPrompt;

            try {
                if (apiMode === 'stability') {
                    if (!apiKey) {
                        throw new Error('Stability AI mode selected but no API key found. Please set it in Settings.');
                    }
                    await generateWithStability(fullPrompt, img, loading);
                } else {
                    await generateWithPollinations(fullPrompt, img, loading);
                }
            } catch (err) {
                loading.innerHTML = `<div style="color:#ff4d6d; padding:20px; text-align:center;">
                    ❌ ${err.message}<br><br>
                    <button class="btn btn-secondary" style="padding:8px 20px; font-size:0.9rem;" onclick="generateImage()">Try Again</button>
                </div>`;
            }
        }

        // Free - Pollinations
        function generateWithPollinations(prompt, img, loading) {
            return new Promise((resolve, reject) => {
                const seed = Math.floor(Math.random() * 999999999);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${selections.ratio.w}&height=${selections.ratio.h}&seed=${seed}&nologo=true&enhance=true&model=flux`;

                const newImg = new Image();
                newImg.crossOrigin = 'anonymous';
                newImg.onload = () => {
                    img.src = url;
                    img.style.display = 'block';
                    loading.style.display = 'none';
                    resolve();
                };
                newImg.onerror = () => reject(new Error('Failed to generate image from free service'));
                newImg.src = url;
            });
        }

        // Stability AI
        async function generateWithStability(prompt, img, loading) {
            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('output_format', 'png');
            formData.append('aspect_ratio', selections.ratio.stability || '1:1');
            formData.append('negative_prompt', 'blurry, low quality, deformed, distorted, text, watermark');

            const response = await fetch('https://api.stability.ai/v2beta/stable-image/generate/sd3', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Accept': 'image/*'
                },
                body: formData
            });

            if (!response.ok) {
                const errText = await response.text();
                let msg = `Stability AI Error (${response.status})`;
                try {
                    const json = JSON.parse(errText);
                    msg = json.errors ? json.errors.join(', ') : (json.message || msg);
                } catch(e) {}
                throw new Error(msg);
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            img.src = url;
            img.style.display = 'block';
            loading.style.display = 'none';
        }
    </script>
</body>
</html>
